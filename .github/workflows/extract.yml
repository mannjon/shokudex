name: Extract Part 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to repo root
        run: |
          set -e
          rm -rf /tmp/x && mkdir -p /tmp/x
          unzip -o shokudex-site-files-part1.zip -d /tmp/x
          if [ "$(find /tmp/x -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find /tmp/x -mindepth 1 -maxdepth 1)" ]; then
            mv /tmp/x/*/* /tmp/x/ || true
            rmdir /tmp/x/*/ || true
          fi
          cp -a /tmp/x/. .
          git config user.name "mannjon"
          git config user.email "mannjon@users.noreply.github.com"
          git add -A
          git commit -m "Extract Part 1 files" || echo "nothing to commit"
          git push
