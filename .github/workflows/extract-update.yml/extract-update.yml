name: Extract site update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract only updated files
        run: |
          python3 - << 'PY'
          import zipfile, os
          wanted = {"index.html", "persimmon-fully-mature.jpg"}
          with zipfile.ZipFile("shokudex-site-files.zip") as z:
              for info in z.infolist():
                  base = os.path.basename(info.filename)
                  if base in wanted:
                      with open(base, "wb") as f:
                          f.write(z.read(info.filename))
                      print(f"extracted {info.filename} -> {base}")
          missing = [w for w in wanted if not os.path.exists(w)]
          if missing:
              raise SystemExit(f"missing: {missing}")
          PY
          ls -l index.html persimmon-fully-mature.jpg
      - name: Commit extracted files and remove temp files
        run: |
          git config user.name "mannjon"
          git config user.email "mannjon@users.noreply.github.com"
          rm -f shokudex-site-files.zip
          rm -rf .github
          git add -A
          git status --short
          git commit -m "Update index.html and add persimmon-fully-mature.jpg" || echo "nothing to commit"
          git push
