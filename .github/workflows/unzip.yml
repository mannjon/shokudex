name: Unzip site files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files to root
        run: |
          unzip -o shokudex-site-files.zip -d _extracted
          unzip -l shokudex-site-files.zip
          find _extracted -type f -exec mv -n {} . \;
          rm -rf _extracted shokudex-site-files.zip .github
          ls -la
          git config user.name "mannjon"
          git config user.email "mannjon@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add Shokudex site files" || echo "nothing to commit"
          git push
